# Emulador de proveedores externos, gestionado por COOLIFY.
#
# La aplicación en Coolify se llama `atlas-provider-mockup-server`
# (uuid `km1gsygciydseniief8nkgen`), sigue la rama `dev` y tiene el build pack `dockercompose`
# apuntando a `/docker-compose.coolify.yml` — este archivo. Sin él la aplicación existe pero no
# puede desplegar nada, que es exactamente donde estaba hasta el 2026-09-05.
#
# ## Este servicio NO se publica a internet, y es deliberado
#
# No lleva dominio. Quien lo consume es AtlasBackend desde dentro de la red compartida de Coolify,
# por el alias `external-providers-mock`. Darle un FQDN sería exponer a cualquiera un servidor que
# firma verificaciones de identidad y reportes crediticios con respuestas fabricadas: nada que
# proteger, pero tampoco nada que anunciar.
#
# ## Lo que este archivo NO trae
#
# `env_file`: Coolify añade `env_file: - .env` a cada servicio por su cuenta, y las variables se
# pegan en Environment Variables de la aplicación. Las que entiende el servidor están en
# `.env.example`; ninguna es obligatoria. Las dos de ACCESO se declaran abajo en `environment:` para
# que Coolify las muestre en la interfaz aunque estén vacías: vacías significan «plano de control
# apagado, rutas legacy sólo desde el propio contenedor» y «CORS sólo para localhost».
#
# Tampoco `cache_from`. En este VPS no hay registro, así que un `cache_from: ['<imagen>:coolify']`
# falla siempre con `pull access denied` y deja el build SIN caché — cuesta y no da nada.

name: atlas-provider-mockup-server

services:
  mock:
    environment:
      APP_COMMIT_SHA: '${SOURCE_COMMIT:-}'
      APP_VERSION: '2.0.0'
    image: atlas-provider-mockup-server:coolify
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # Bearer del plano de control y de las rutas legacy con efecto. Mínimo 16 caracteres.
      MOCK_PROVIDERS_CONTROL_TOKEN: ${MOCK_PROVIDERS_CONTROL_TOKEN:-}
      # Orígenes de navegador admitidos por CORS (lista por comas). Ver README, «Quién puede...».
      MOCK_PROVIDERS_CORS_ORIGINS: ${MOCK_PROVIDERS_CORS_ORIGINS:-}
      # Cuerpo máximo. 2 MiB porque el paquete de contingencia del SIAT (hasta 500 facturas en un
      # tar.gz en base64) ya pasa de los 64 KiB por defecto con 500 facturas de una línea.
      MOCK_PROVIDERS_MAX_BODY_BYTES: ${MOCK_PROVIDERS_MAX_BODY_BYTES:-2097152}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # Alias ESTABLE en la red compartida: es como lo encuentra AtlasBackend. El nombre del
    # contenedor lleva una marca de tiempo y cambia en cada despliegue; este alias no.
    #
    # El nombre es específico a propósito. Un alias corto y genérico lo puede reclamar cualquier
    # otro proyecto de esta máquina, y ya pasó con `redis`: el `redis` de la infraestructura de
    # Coolify ganaba la resolución y el fallo no se parecía en nada a un alias duplicado.
    networks:
      default: {}
      coolify:
        aliases: ['external-providers-mock']
    # `init: true` reparte SIGTERM al proceso de Node, sin depender de instalar un binario.
    init: true
    # SIN `ports:`. Coolify nombra cada contenedor con una marca de tiempo, así que en cada
    # despliegue crea uno NUEVO en vez de reemplazar el anterior; mientras el viejo siga en pie
    # sujeta el puerto del host y el nuevo muere con `address already in use`. `expose` publica el
    # puerto sólo hacia las redes Docker, que es todo lo que este servicio necesita.
    expose: ['4010']
    stop_grace_period: 20s
    # Emuladores sobre `node:http`, con estado sólo por corrida y en memoria; el mayor cuerpo
    # admitido es un paquete del SIAT de 2 MiB. Con eso sobraban 256 MB, pero
    # `POST /mock/qa/identity-images` dibuja con sharp/libvips, cuya memoria es NATIVA: medido en
    # macOS, ~220 MB de RSS tras diez personas (el heap de JS no pasa de 30). Se sube a 512 MB para
    # no morir por OOM a mitad de una corrida; el tope sigue importando en una máquina donde los
    # builds de los portales ya la hacen paginar.
    deploy:
      resources:
        limits:
          memory: 512m

# ---------------------------------------------------------------------------------------------
# La red COMPARTIDA de Coolify. Es por donde AtlasBackend alcanza este servicio.
#
# **Hace falta activar «Connect To Predefined Network» en esta aplicación dentro de Coolify.**
networks:
  default: {}
  coolify:
    external: true
    name: coolify
