# Integración continua del emulador de proveedores (auditoría a producción, 2026-09-13).
#
# El servidor sigue sin dependencias de ejecución. Las herramientas de calidad viven en devDependencies.
#
# Desde el motor QA (2026-09-21) el humo ya no es lo único: la suite de contrato comprueba las
# trampas que este emulador tenía y que hacían pasar pruebas que no debían pasar —ruta inexistente
# con 200, método equivocado con 200, escenario desconocido cayendo al camino feliz—. Por eso corre
# ANTES que el humo: si el contrato se rompió, el humo va a pasar igual y el diagnóstico sería peor.
name: CI

on:
  pull_request:
    branches: [main, dev, test]
  push:
    branches: [main, dev, test]

permissions:
  contents: read

# Una corrida por rama. En pull_request la nueva cancela la anterior; en push a dev/test NO: esa
# corrida es la evidencia del SHA promovido y cancelarla deja al commit sin veredicto (medido en el
# portal el 2026-09-28: tres «cancelled» seguidos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Contrato, aislamiento y configuración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run syntax:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  smoke:
    name: Arranca y cada proveedor responde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke

  security:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Instalar gitleaks verificado
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks dir . --redact --exit-code 1

  container-smoke:
    name: Imagen y smoke del contenedor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, smoke, security]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/container-smoke.sh

  # ÚNICO trabajo que se exige como check requerido en dev/test/main. Corre siempre y sólo es verde
  # si TODOS los trabajos obligatorios lo son: `skipped` o `cancelled` en cualquiera es rojo aquí.
  release-gate:
    name: release-gate
    if: always()
    needs: [test, smoke, security, container-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los trabajos obligatorios en success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success")' >/dev/null; then
            echo "release-gate: success"
          else
            echo "::error::Algún trabajo obligatorio no terminó en success"; exit 1
          fi

  deploy-dev:
    name: Desplegar DEV sólo después de los quality gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [release-gate]
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
